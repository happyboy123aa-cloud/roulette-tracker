name: Roulette Tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Roulette Tracker
        run: |
          mkdir -p extracted
          unzip -o RouletteTracker_NEW_9-15.zip -d extracted
          echo "Files extracted:"
          find extracted -maxdepth 3 -type f | sort

      - name: Verify Android project
        run: |
          test -f extracted/RouletteTracker/settings.gradle
          test -f extracted/RouletteTracker/app/build.gradle
          echo "Android project found successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: extracted/RouletteTracker
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roulette-Tracker-9-15
          path: extracted/RouletteTracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
