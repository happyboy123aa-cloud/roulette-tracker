name: Build Roulette Track Lite APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Roulette Tracker ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/RouletteTracker_APK_READY.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/RouletteTracker_APK_READY.zip"
          else
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "RouletteTracker*.zip" \
              -not -path "*/.git/*" \
              | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RouletteTracker ZIP not found!"
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/android_project"
          mkdir -p "$GITHUB_WORKSPACE/android_project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android_project"

          echo "ZIP extracted successfully."


      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/android_project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version


      # FIX: permissionButton setText compile error
      - name: Fix MainActivity Java
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/roulette/tracker/MainActivity.java"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MainActivity.java not found!"
            exit 1
          fi

          echo "Patching MainActivity.java..."

          sed -i \
            's/findViewById(R.id.permissionButton)\.setText(/((android.widget.TextView) findViewById(R.id.permissionButton)).setText(/g' \
            "$FILE"

          echo "Checking permissionButton:"
          grep -n "permissionButton" "$FILE" || true


      - name: Set app name
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          STRINGS="app/src/main/res/values/strings.xml"
          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ -f "$STRINGS" ]; then
            sed -i \
              's#<string name="app_name">[^<]*</string>#<string name="app_name">roulette track lite</string>#g' \
              "$STRINGS"
          fi

          if [ -f "$MANIFEST" ]; then
            sed -i \
              's/android:label="Roulette Tracker"/android:label="roulette track lite"/g' \
              "$MANIFEST"
          fi


      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace


      - name: Rename APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            find app/build -type f 2>/dev/null | sort
            exit 1
          fi

          cp "$APK" "roulette track lite.apk"

          ls -lh "roulette track lite.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roulette-track-lite-apk
          path: "${{ env.PROJECT_DIR }}/roulette track lite.apk"
          if-no-files-found: error
