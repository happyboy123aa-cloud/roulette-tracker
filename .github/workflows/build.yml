name: Build Paper Bets

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Extract APK ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for APK ZIP..."

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -iname "*.zip" \) \
            -not -path "$GITHUB_WORKSPACE/.git/*" \
            -not -path "$GITHUB_WORKSPACE/extracted/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            echo "Files in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" -maxdepth 4 -type f | sort

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( -name "settings.gradle" \
               -o -name "settings.gradle.kts" \) \
            -print \
            -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              \( -name "build.gradle" \
                 -o -name "build.gradle.kts" \) \
              -print \
              -quit \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo "Extracted directory:"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fix MainActivity
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          find "$PROJECT_DIR/app/src/main" \
            -maxdepth 3 \
            -type f 2>/dev/null | sort || true

      - name: Set App Name
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            echo "Updating Android app label..."

            sed -i \
              's/android:label="[^"]*"/android:label="Paper Bets"/g' \
              "$MANIFEST"

            echo "Current manifest:"
            cat "$MANIFEST"
          fi

      - name: Force Android Manifest App Name
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if grep -q 'android:label=' "$MANIFEST"; then
            sed -i \
              's/android:label="[^"]*"/android:label="Paper Bets"/g' \
              "$MANIFEST"
          else
            sed -i \
              's/<application /<application android:label="Paper Bets" /' \
              "$MANIFEST"
          fi

          echo "Final application label:"
          grep -o 'android:label="[^"]*"' "$MANIFEST" || true

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building Android APK..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload Paper Bets APK
        uses: actions/upload-artifact@v4
        with:
          name: Paper-Bets-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
