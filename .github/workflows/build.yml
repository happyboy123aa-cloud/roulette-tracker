name: Roulette Tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android Project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name settings.gradle -type f -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "app-debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roulette-Tracker
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
