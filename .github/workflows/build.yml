name: Build Roulette Track Lite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Extract APK ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for APK ZIP..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            | grep -E "RouletteTrackLite|RouletteTracker" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Roulette APK ZIP not found!"
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -not -path "*/.git/*"
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/android_project"
          mkdir -p "$GITHUB_WORKSPACE/android_project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android_project"

          echo "ZIP extracted successfully."

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/android_project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            find "$GITHUB_WORKSPACE/android_project" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Fix MainActivity
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find app/src/main/java \
            -type f \
            -name "MainActivity.java" \
            -print -quit)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.java not found!"
            exit 1
          fi

          echo "Found:"
          echo "$MAIN_FILE"

          sed -i \
            's/findViewById(R.id.permissionButton)\.setText(/((android.widget.TextView) findViewById(R.id.permissionButton)).setText(/g' \
            "$MAIN_FILE"

          echo "MainActivity fixed."

      - name: Set App Name
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          STRINGS="app/src/main/res/values/strings.xml"

          if [ -f "$STRINGS" ]; then
            sed -i \
              's#<string name="app_name">[^<]*</string>#<string name="app_name">roulette track lite</string>#g' \
              "$STRINGS"
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Rename APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            find app/build -type f 2>/dev/null | sort
            exit 1
          fi

          cp "$APK" "roulette track lite.apk"

          ls -lh "roulette track lite.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roulette-track-lite
          path: "${{ env.PROJECT_DIR }}/roulette track lite.apk"
          if-no-files-found: error
