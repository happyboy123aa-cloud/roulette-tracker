name: Roulette Tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          echo "Checking RouletteTracker project..."
          test -f RouletteTracker/settings.gradle
          test -f RouletteTracker/app/build.gradle
          echo "Project found successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: RouletteTracker
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roulette-Tracker-9-15
          path: RouletteTracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
