name: Roulette Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find ZIP
        run: |
          echo "ZIP files in repository:"
          find . -maxdepth 2 -type f \( -name "*.zip" -o -name "*.ZIP" \) -print

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f \( -name "*.zip" -o -name "*.ZIP" \) | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p build-project
          unzip -q "$ZIP_FILE" -d build-project

          echo "Extracted files:"
          find build-project -maxdepth 3 -type f | head -100

      - name: Locate Gradle project
        run: |
          GRADLEW=$(find build-project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RouletteTracker-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
