name: Build Roulette Tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Roulette Tracker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Roulette Tracker ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          echo "ZIP: $ZIP"

          mkdir -p project
          unzip -q "$ZIP" -d project

          SETTINGS=$(find project -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found!"
            find project -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Project
        run: |
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "Android project found successfully."

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND!"
            find "$PROJECT_DIR/app/build" -type f | head -100
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp "$APK" "$GITHUB_WORKSPACE/apk/RouletteTracker.apk"

      - name: Upload Roulette Tracker APK
        uses: actions/upload-artifact@v4
        with:
          name: Roulette Tracker APK
          path: apk/RouletteTracker.apk
          if-no-files-found: error
