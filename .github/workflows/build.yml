name: Bet Calculator

on:
  push:
    branches:
      - main  # আপনার মূল ব্রাঞ্চের নাম অনুযায়ী পরিবর্তন করতে পারেন
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. কোড চেকআউট করা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. Java (JDK) সেটআপ করা
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # ৩. Gradle ক্যাশ ও ফাইল প্রস্তুত করা
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      # ৪. Keystore ফাইল Decode করা (Secrets থেকে)
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/my-release-key.jks

      # ৫. Release AAB (App Bundle) বিল্ড করা
      - name: Build Release App Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      # ৬. বিল্ড হওয়া AAB ফাইল GitHub Artifact হিসেবে সেভ করা
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Bet-Calculator-Release
          path: android/app/build/outputs/bundle/release/app-release.aab
