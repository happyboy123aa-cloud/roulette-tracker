name: Build Roulette Track Lite APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. GitHub repository থেকে ZIP নেবে
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. RouletteTracker ZIP খুঁজে বের করবে এবং নিজে extract করবে
      - name: Extract Roulette Tracker ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          # প্রথমে নির্দিষ্ট ZIP নাম খুঁজবে
          if [ -f "$GITHUB_WORKSPACE/RouletteTracker_APK_READY.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/RouletteTracker_APK_READY.zip"
          else
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "RouletteTracker*.zip" \
              -not -path "*/.git/*" \
              | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RouletteTracker ZIP file not found!"
            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -not -path "*/.git/*"
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/android_project"
          mkdir -p "$GITHUB_WORKSPACE/android_project"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/android_project"

          echo "ZIP extracted successfully."

          echo ""
          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/android_project" \
            -maxdepth 5 \
            -type f \
            | sort


      # 3. ZIP-এর ভিতরে settings.gradle খুঁজবে
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/android_project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found inside ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app folder not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # 4. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 5. Gradle নিজে install করবে
      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version


      # 6. App name = roulette track lite
      - name: Set app name
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          STRINGS="app/src/main/res/values/strings.xml"
          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ -f "$STRINGS" ]; then
            sed -i \
              's#<string name="app_name">[^<]*</string>#<string name="app_name">roulette track lite</string>#g' \
              "$STRINGS"
          fi

          if [ -f "$MANIFEST" ]; then
            sed -i \
              's/android:label="Roulette Tracker"/android:label="roulette track lite"/g' \
              "$MANIFEST"
          fi


      # 7. APK build
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace


      # 8. APK-এর নাম পরিবর্তন
      - name: Rename APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            find app/build -type f 2>/dev/null | sort
            exit 1
          fi

          cp "$APK" "roulette track lite.apk"

          echo "APK created successfully:"
          ls -lh "roulette track lite.apk"


      # 9. APK Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roulette-track-lite-apk
          path: "${{ env.PROJECT_DIR }}/roulette track lite.apk"
          if-no-files-found: error
