name: Roulette Track Lite APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -type f -name "settings.gradle" \
            -not -path "*/.gradle/*" \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Android project not found!"
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -L --retry 5 --fail \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Set app name
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          sed -i 's/Roulette Tracker/roulette track lite/g' \
            app/src/main/res/values/strings.xml || true

          sed -i 's/android:label="Roulette Tracker"/android:label="roulette track lite"/g' \
            app/src/main/AndroidManifest.xml || true

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Rename APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            "roulette track lite.apk"

          ls -lh "roulette track lite.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roulette-track-lite-apk
          path: "${{ env.PROJECT_DIR }}/roulette track lite.apk"
          if-no-files-found: error
