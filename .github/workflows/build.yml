name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Extract project
        run: |
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Find Gradle project
        run: |
          GRADLE=$(find project -type f -name "gradlew" | head -n 1)
          if [ -z "$GRADLE" ]; then
            echo "gradlew not found"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "GRADLE_DIR=$(dirname "$GRADLE")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roulette-APK
          path: "**/build/outputs/apk/debug/*.apk"
