name: Roulette Tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android Project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -o "$ZIP_FILE" -d project || true

          if [ ! -f "project/RouletteTracker/gradlew" ]; then
            echo "ERROR: gradlew not found"
            echo "Project structure:"
            find project/RouletteTracker -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Android project found successfully."

      - name: Build APK
        shell: bash
        working-directory: project/RouletteTracker
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find project/RouletteTracker -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roulette Tracker
          path: ${{ steps.apk.outputs.path }}
