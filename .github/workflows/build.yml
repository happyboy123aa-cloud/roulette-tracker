name: Roulette Tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "Searching for gradlew..."

          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP"
            echo "Extracted files:"
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Android project found at: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roulette Tracker
          path: ${{ steps.apk.outputs.path }}
