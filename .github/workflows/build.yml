name: Build Roulette Track Lite APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "settings.gradle" \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        shell: bash
        run: |
          curl -L --fail --retry 5 \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle.zip

          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Set app name
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">roulette track lite</string>#g' \
              app/src/main/res/values/strings.xml
          fi

          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:label="Roulette Tracker"/android:label="roulette track lite"/g' \
              app/src/main/AndroidManifest.xml
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Rename APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not created!"
            find app/build -type f 2>/dev/null | sort
            exit 1
          fi

          cp "$APK_PATH" "roulette track lite.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roulette-track-lite-apk
          path: "${{ env.PROJECT_DIR }}/roulette track lite.apk"
          if-no-files-found: error
