name: Roulette Tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Roulette Tracker APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        working-directory: RouletteOverlay
        run: chmod +x gradlew || true

      - name: Build APK
        working-directory: RouletteOverlay
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        run: |
          find RouletteOverlay/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roulette-Tracker-APK
          path: RouletteOverlay/app/build/outputs/apk/**/*.apk
